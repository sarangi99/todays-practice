---
# tasks file for webrole
- name: install apache2 on debian 
  ansible.builtin.apt:
    name: "{{apache2var}}"
    state: present
  notify: restartwebserver

- name : star the apche2 server 
  ansible.builtin.service:
     name: "{{apache2var}}"
     state: started
  notify: restartwebserver